<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Muhammad Hammad Nadeem, Machine Learning Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#1F3A5F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FB6A8"/>
      <stop offset="1" stop-color="#6CC4F0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>

  <!-- network decoration -->
  <g stroke="#6CC4F0" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <line x1="760" y1="70" x2="880" y2="130"/>
    <line x1="880" y1="130" x2="1000" y2="80"/>
    <line x1="880" y1="130" x2="940" y2="230"/>
    <line x1="1000" y1="80" x2="1110" y2="150"/>
    <line x1="940" y1="230" x2="1110" y2="150"/>
    <line x1="760" y1="70" x2="800" y2="220"/>
    <line x1="800" y1="220" x2="940" y2="230"/>
    <line x1="1000" y1="80" x2="1060" y2="30"/>
  </g>
  <g fill="#3FB6A8">
    <circle cx="760" cy="70" r="7"/>
    <circle cx="880" cy="130" r="11"/>
    <circle cx="1000" cy="80" r="8"/>
    <circle cx="940" cy="230" r="9"/>
    <circle cx="1110" cy="150" r="7"/>
    <circle cx="800" cy="220" r="6"/>
    <circle cx="1060" cy="30" r="5"/>
  </g>
  <g fill="#0B1B33" opacity="0.55">
    <circle cx="880" cy="130" r="4"/>
    <circle cx="940" cy="230" r="3.5"/>
  </g>

  <!-- text -->
  <rect x="64" y="64" width="64" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="64" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">Muhammad Hammad Nadeem</text>
  <text x="64" y="167" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="500" fill="#CFE3F5">Machine Learning Engineer</text>
  <text x="64" y="203" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#9FB8D3">Agentic AI Systems  ·  Real-time Backends  ·  Industrial Software</text>
  <text x="64" y="256" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#3FB6A8">Pakistan  |  Available to relocate to Germany</text>
</svg>
